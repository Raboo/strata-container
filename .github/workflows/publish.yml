name: Publish container image

# Upstream has no release webhook we can subscribe to, so poll. Every run is a
# no-op unless the images for the newest release do not exist yet, or a manual
# dispatch asks for a specific tag. GitHub disables schedules after 60 days of
# repository inactivity; the keepalive workflow lands a commit before that.
#
# From 0.2.1 on, upstream builds its images from signed engine component
# packages (docker/fetch-engines.py) plus the Terminal sources, and publishes
# the result with docker/build.sh. This workflow does the same, with one image
# per backend family:
#   ghcr.io/raboo/strata:<version>        CUDA 13 + CUDA 12 engines
#   ghcr.io/raboo/strata:<version>-rocm   HIP gfx120x + gfx110x + gfx1151
# The Terminal picks the engine that fits the card/driver at start.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v0.2.1). Default: latest release."
        required: false
        type: string
      force:
        description: "Rebuild even when this version is already in GHCR."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-strata
  cancel-in-progress: false

env:
  UPSTREAM: Niko1221/Strata
  # GHCR paths must be lowercase; the account login is "Raboo".
  IMAGE: ghcr.io/raboo/strata

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      is_latest: ${{ steps.release.outputs.is_latest }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Resolve tag, commit and release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          tag="${INPUT_TAG:-$latest}"

          # Tag goes into a URL path and a shell word: accept only released-style names.
          if ! printf '%s' "$tag" | grep -Eq '^v?[0-9][0-9A-Za-z._-]*$'; then
            echo "::error::invalid upstream tag '$tag'"
            exit 1
          fi

          obj="$(gh api "repos/$UPSTREAM/git/ref/tags/$tag")"
          sha="$(printf '%s' "$obj" | jq -r .object.sha)"
          obj_type="$(printf '%s' "$obj" | jq -r .object.type)"
          if [ "$obj_type" = "tag" ]; then
            sha="$(gh api "repos/$UPSTREAM/git/tags/$sha" --jq .object.sha)"
          fi

          version="${tag#v}"
          is_latest=false
          [ "$tag" = "$latest" ] && is_latest=true

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "is_latest=$is_latest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream release"
            echo
            echo "- tag: \`$tag\`"
            echo "- commit: \`$sha\`"
            echo "- latest release: \`$latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether the CUDA image is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          skip=false

          if [ "$FORCE" = "true" ]; then
            echo "Force requested; rebuilding $IMAGE:$VERSION."
          else
            echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              skip=true
              echo "$IMAGE:$VERSION already exists; the CUDA build will be skipped."
            else
              echo "$IMAGE:$VERSION does not exist yet; it will be built."
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push ${{ matrix.label }} ${{ needs.resolve.outputs.tag }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CUDA
            flavors: cuda13,cuda12
            build_flavor: cuda
            suffix: ""
          - label: ROCm
            flavors: rocm-gfx120x,rocm-gfx110x,rocm-gfx1151
            build_flavor: hip
            suffix: "-rocm"
    steps:
      - name: Check whether this variant is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$VERSION$SUFFIX" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION$SUFFIX already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/az \
            /usr/lib/jvm
          sudo apt-get clean
          sudo docker image prune -af
          df -h /

      - name: Check out this repository
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out upstream at the release tag
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Niko1221/Strata
          ref: ${{ needs.resolve.outputs.tag }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      # The wrapper overrides are applied from the Terminal's build_config, on
      # the installed run config (so they persist in /data/install). build.sh
      # assembles terminal-src from `git ls-files`, hence the `git add`.
      - name: Patch the Terminal for the wrapper overrides
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cp docker/wrapper_env.py src/strata_cli/launch/
          python3 docker/patch-terminal.py src
          git -C src add strata_cli/launch/wrapper_env.py
          python3 -m py_compile src/strata_cli/launch/runner.py src/strata_cli/launch/wrapper_env.py

      - name: Test the wrapper overrides
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import importlib.util, json, os, pathlib, tempfile
          src = pathlib.Path("src")
          spec = importlib.util.spec_from_file_location("wrapper_env", src / "strata_cli/launch/wrapper_env.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tmp = pathlib.Path(tempfile.mkdtemp())
          mtp = tmp / "mtp"
          mtp.mkdir()
          cfg_path = tmp / "strata-test.json"
          cfg_path.write_text(json.dumps({"args": ["--native", "m.gguf", "--mtp", str(mtp)]}))
          os.environ.update(
              PREFILL="auto:32768", CONVERSATION_CACHE_MIB="8192",
              SAMPLING_TEMPERATURE="1.0", SAMPLING_TOP_P="0.95", SAMPLING_TOP_K="20",
              SAMPLING_MIN_P="0.0", SAMPLING_PRESENCE_PENALTY="0.0", SAMPLING_REPETITION_PENALTY="1.0",
              DRAFT_VOCAB="en")
          cfg = mod.apply(json.loads(cfg_path.read_text()), path=cfg_path)
          assert cfg["user_args"] == ["--prefill", "auto:32768", "--conversation-cache-mib", "8192"], cfg["user_args"]
          assert cfg["sampling"]["top_k"] == 20 and cfg["sampling"]["top_p"] == 0.95
          assert cfg["draft_vocab"] == "en"
          assert (mtp / "draft_vocab.bin").stat().st_size > 0
          saved = json.loads(cfg_path.read_text())
          assert saved["draft_vocab"] == "en" and saved["user_args"] == cfg["user_args"]
          print("wrapper overrides OK")
          PY

      - name: Log in to GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the signed engine packages
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          FLAVORS: ${{ matrix.flavors }}
        run: |
          set -euo pipefail
          cd src
          python3 docker/fetch-engines.py --release-tag "$TAG" --flavors "$FLAVORS" \
            --out "$RUNNER_TEMP/pkgs" > "$RUNNER_TEMP/engines.tsv"
          cat "$RUNNER_TEMP/engines.tsv"

      - name: Build the image
        if: steps.check.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          BUILD_FLAVOR: ${{ matrix.build_flavor }}
        run: |
          set -euo pipefail
          args=()
          while IFS=$'\t' read -r _flavor _build_flavor folder; do
            [ -n "${folder:-}" ] && args+=(--engine "$folder")
          done < "$RUNNER_TEMP/engines.tsv"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::no engine packages were fetched"
            exit 1
          fi
          bash src/docker/build.sh --flavor "$BUILD_FLAVOR" "${args[@]}" \
            --tag "$IMAGE:$VERSION$SUFFIX" --version "$VERSION"

      - name: Smoke-test the image
        if: steps.check.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          img="$IMAGE:$VERSION$SUFFIX"
          docker run --rm "$img" strata --version
          docker run --rm "$img" sh -c \
            'test -f /opt/strata/terminal/strata_cli/launch/wrapper_env.py &&
             grep -q "wrapper_env.apply(base" /opt/strata/terminal/strata_cli/launch/runner.py &&
             test -f /opt/strata/terminal/data/draft_vocab_en.bin'
          docker run --rm -i \
            -e PREFILL=auto:32768 -e CONVERSATION_CACHE_MIB=8192 \
            -e SAMPLING_TEMPERATURE=1.0 -e SAMPLING_TOP_K=20 -e DRAFT_VOCAB=en \
            "$img" /opt/strata/terminal/python/bin/python3 - <<'PY'
          import json, pathlib, sys, tempfile
          sys.path.insert(0, "/opt/strata/terminal")
          from strata_cli.launch import wrapper_env
          tmp = pathlib.Path(tempfile.mkdtemp())
          mtp = tmp / "mtp"
          mtp.mkdir()
          p = tmp / "cfg.json"
          p.write_text(json.dumps({"args": ["--mtp", str(mtp)]}))
          cfg = wrapper_env.apply(json.loads(p.read_text()), path=p)
          assert cfg["user_args"] == ["--prefill", "auto:32768", "--conversation-cache-mib", "8192"], cfg["user_args"]
          assert cfg["sampling"]["top_k"] == 20 and cfg["sampling"]["temperature"] == 1.0
          assert cfg["draft_vocab"] == "en" and (mtp / "draft_vocab.bin").stat().st_size > 0
          print("wrapper overrides OK in the image")
          PY

      - name: Push the tags
        if: steps.check.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
          IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
        run: |
          set -euo pipefail
          local_tag="$IMAGE:$VERSION$SUFFIX"
          tags=("$local_tag" "$IMAGE:$TAG$SUFFIX")
          [ "$IS_LATEST" = "true" ] && tags+=("$IMAGE:latest$SUFFIX")
          for tag in "${tags[@]}"; do
            docker tag "$local_tag" "$tag"
            docker push "$tag"
          done
          {
            echo
            echo "### Published (${{ matrix.label }})"
            echo
            echo '```'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify published images
    needs: [resolve, build]
    # Runs after the builds, and on its own when both variants already exist —
    # dispatch the workflow with the current tag to re-check cheaply.
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect published tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
        run: |
          set -euo pipefail
          missing=0
          for suffix in "" "-rocm"; do
            case "$suffix" in
              "") latest_ref="$IMAGE:latest" ;;
              *) latest_ref="$IMAGE:latest$suffix" ;;
            esac
            refs=("$IMAGE:$VERSION$suffix" "$IMAGE:$TAG$suffix")
            [ "$IS_LATEST" = "true" ] && refs+=("$latest_ref")
            for ref in "${refs[@]}"; do
              if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
                echo "== $ref"
                docker buildx imagetools inspect "$ref" | sed -n '1,10p'
              else
                echo "::warning::$ref is missing"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::one or more expected image tags are missing"
            exit 1
          fi

      - name: Check anonymous pulls
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cfg="$(mktemp -d)"
          public=1
          for suffix in "" "-rocm"; do
            if DOCKER_CONFIG="$cfg" docker buildx imagetools inspect "$IMAGE:$VERSION$suffix" >/dev/null 2>&1; then
              echo "$IMAGE:$VERSION$suffix: anonymous pull works"
            else
              public=0
              echo "::warning::$IMAGE:$VERSION$suffix is not publicly readable. Make the package public in its settings: https://github.com/users/Raboo/packages/container/strata/settings"
            fi
          done
          echo "anonymous pulls work: $([ "$public" = 1 ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"

  update-readme:
    name: Record latest release in README
    needs: [resolve, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update the release marker
        if: needs.verify.result == 'success' && needs.resolve.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/contents/README.md"

          for attempt in 1 2 3; do
            sha="$(gh api "$api" --jq .sha)"
            gh api "$api" --jq .content | base64 -d > README.md

            rc=0
            python3 - "$VERSION" "$TAG" <<'PY' || rc=$?
          import pathlib
          import re
          import sys

          version, tag = sys.argv[1], sys.argv[2]
          path = pathlib.Path("README.md")
          text = path.read_text()
          entry = f"Current image: `ghcr.io/raboo/strata:{version}` (upstream release `{tag}`)"
          pattern = r"(<!-- latest-release -->\n).*?(\n<!-- /latest-release -->)"
          updated, count = re.subn(pattern, lambda m: m.group(1) + entry + m.group(2), text, flags=re.S)
          if count != 1:
              raise SystemExit("README.md is missing the latest-release markers")
          if updated == text:
              raise SystemExit(3)
          path.write_text(updated)
          PY

            if [ "$rc" -eq 3 ]; then
              echo "README already records $TAG."
              exit 0
            fi
            [ "$rc" -eq 0 ] || exit "$rc"

            content="$(base64 < README.md | tr -d '\n')"
            if gh api -X PUT "$api" \
                 -f message="Document upstream release $TAG in README" \
                 -f content="$content" \
                 -f sha="$sha" \
                 -f branch=main >/dev/null; then
              echo "Updated README for $TAG."
              exit 0
            fi

            echo "Push conflict on attempt $attempt; retrying."
            sleep $((attempt * 2))
          done

          echo "::error::could not update README.md"
          exit 1
